name: Application Deploy

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  IMAGE_TAG: ${{ github.sha }}

on:
  push: 
    branches:
      - main
    paths:
     - "app/**"
     - ".github/workflows/app.yaml"

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  application-deploy:
    runs-on: ubuntu-latest
    environment: ${{ vars.ACTIVE_ENVIRONMENT }}

    defaults:
      run:
        working-directory: .
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: eu-west-2

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ steps.login-ecr.outputs.registry }}/airtrail-${{ vars.ACTIVE_ENVIRONMENT }}:${{ env.IMAGE_TAG }} \
            ./app

      - name: Push Docker image
        run: | 
          docker push \
            ${{ steps.login-ecr.outputs.registry }}/airtrail-${{ vars.ACTIVE_ENVIRONMENT }}:${{ env.IMAGE_TAG }}

      - name: Download task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition airtrail-${{ vars.ACTIVE_ENVIRONMENT }} \
            --query taskDefinition \
            > task-definition.json

      - name: Update task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: airtrail
          image: ${{ steps.login-ecr.outputs.registry }}/airtrail-${{ vars.ACTIVE_ENVIRONMENT }}:${{ env.IMAGE_TAG }}

      - name: Deploy task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with: 
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: airtrail-${{ vars.ACTIVE_ENVIRONMENT }}-service
          cluster: airtrail-${{ vars.ACTIVE_ENVIRONMENT }}-cluster
          wait-for-service-stability: true